<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>nimbleVPN — вход в админку</title>
<style>
  :root{ color-scheme: dark; --bg:#050b16; --panel:#0c1730; --line:rgba(108,163,255,.18); --text:#eaf4ff; --muted:#8ea3c6; --blue:#2f7bff; }
  *{ box-sizing:border-box }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(47,123,255,.28), transparent 65%),
      radial-gradient(600px 400px at 90% 110%, rgba(120,80,255,.18), transparent 60%),
      var(--bg);
    color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%; max-width:380px; background:linear-gradient(180deg, rgba(20,38,70,.92), rgba(10,20,38,.96));
    border:1px solid var(--line); border-radius:20px; padding:26px 22px;
    box-shadow:0 30px 70px -40px #000, inset 0 1px 0 rgba(255,255,255,.04);
  }
  .logo{ display:flex; align-items:center; gap:10px; margin-bottom:20px }
  .logo i{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg, rgba(47,123,255,.4), rgba(47,123,255,.12));
    border:1px solid rgba(108,163,255,.3); font-style:normal; font-size:17px;
  }
  .logo b{ font-size:16px; letter-spacing:-.01em }
  .logo b span{ color:#7fb9ff }
  h1{ font-size:19px; margin:0 0 6px; letter-spacing:-.01em }
  p{ margin:0 0 18px; color:var(--muted); font-size:13px }
  label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#7f95b8; margin-bottom:7px }
  input{
    width:100%; padding:14px 14px; border-radius:12px; border:1px solid rgba(108,163,255,.28);
    background:#081226; color:var(--text); font:15px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;
    outline:none; margin-bottom:12px;
  }
  input:focus{ border-color:rgba(108,163,255,.6); box-shadow:0 0 0 3px rgba(47,123,255,.15) }
  button{
    width:100%; padding:14px 16px; border:0; border-radius:12px; cursor:pointer;
    background:linear-gradient(145deg,#2f7bff,#1b52c9); color:#fff; font:600 15px/1 system-ui;
    transition:filter .18s, transform .05s;
  }
  button:hover{ filter:brightness(1.07) }
  button:active{ transform:translateY(1px) }
  .hint{ margin:14px 0 0; font-size:12px; color:#6f84a6; text-align:center }
  .err{ display:none; margin:0 0 12px; padding:10px 12px; border-radius:10px; font-size:13px;
        color:#ffb3b3; background:rgba(255,100,100,.12); border:1px solid rgba(255,120,120,.3) }
  a.back{ display:block; text-align:center; margin-top:16px; font-size:13px; color:#7fb9ff; text-decoration:none }
</style>
</head>
<body>
<main class="card">
  <div class="logo"><i>🔒</i><b>nimble<span>VPN</span></b></div>
  <h1>Вход в админку</h1>
  <p>Введите ключ администратора — откроется панель подписок и устройств.</p>
  <div class="err" id="err">Похоже, ключ не подошёл. Проверьте и попробуйте ещё раз.</div>
  <form id="f" autocomplete="off">
    <label for="key">Ключ администратора</label>
    <input id="key" type="password" name="key" placeholder="nvpn-…" autocomplete="current-password" required>
    <button type="submit">Открыть панель</button>
  </form>
  <p class="hint">Страница ничего не сохраняет: ключ уходит только в ваш воркер.</p>
  <a class="back" href="index.html">← вернуться на сайт</a>
</main>
<script>
  var WORKER = 'https://nimblevpn-sub.i-a-nedbaylo.workers.dev';
  var f = document.getElementById('f');
  var input = document.getElementById('key');
  var err = document.getElementById('err');

  function go(key) {
    key = (key || '').trim();
    if (!key) { err.style.display = 'block'; return; }
    window.location.href = WORKER + '/admin?key=' + encodeURIComponent(key);
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    go(input.value);
  });

  try {
    var q = new URLSearchParams(window.location.search).get('key');
    if (q) { input.value = q; go(q); }
  } catch (e) {}

  input.addEventListener('input', function () { err.style.display = 'none'; });
</script>
</body>
</html>
